<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404徵才網｜招募展示</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#33475f;font:15px/1.7 system-ui,sans-serif}header{background:white;border-bottom:3px solid #d9963d;padding:18px max(20px,calc((100vw - 900px)/2))}header strong{font-size:22px;color:#a56a25}header small{display:block;color:#8894a3}main{max-width:900px;margin:30px auto;background:white;padding:28px;border:1px solid #dce2e9;border-radius:10px}h1{font-size:25px}p{color:#6d7d90}.notice{padding:13px 16px;background:#fff6e5;border:1px solid #edd3a5;border-radius:7px;color:#8f6b31}form{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:24px}label{display:block;font-size:13px}input,textarea{display:block;width:100%;font:inherit;border:1px solid #ccd7e4;border-radius:6px;padding:10px;margin-top:6px}label.wide{grid-column:1/-1}button{background:#2e5d9c;color:white;border:0;border-radius:6px;padding:12px;font:inherit;cursor:pointer}.result{padding:20px;background:#eef7f1;border-radius:8px}a{color:#3767a3}@media(max-width:650px){main{margin:16px;padding:18px}form{grid-template-columns:1fr}}</style></head><body><header><strong>404徵才網</strong><small>人才招募展示站</small></header><main><p>企業後台 / 新增職缺</p><h1>建立一份招募職缺</h1><div class="notice">此頁為前端展示，不送出履歷或職缺至任何外部網站。Agent 工作台會展示輸入此頁網址後填表的操作。</div><form id="demo-form"><label>公司名稱<input required name="company"></label><label>職缺名稱<input required name="role"></label><label>工作地點<input required name="location"></label><label>招募人數<input required name="hires" type="number" min="1"></label><label>月薪下限<input required name="min" type="number" min="1"></label><label>月薪上限<input required name="max" type="number" min="1"></label><label class="wide">工作內容<textarea required name="description" rows="4"></textarea></label><button type="submit">審核通過並模擬刊登</button></form><p class="result" id="result" hidden>已完成本頁模擬刊登，沒有傳送到外部網站。</p><p><a href="/">回到產業人才雷達</a></p></main><script>document.getElementById('demo-form').addEventListener('submit',event=>{event.preventDefault();const d=new FormData(event.currentTarget);if(Number(d.get('max'))<Number(d.get('min'))){event.currentTarget.elements.max.setCustomValidity('上限不可低於下限');event.currentTarget.elements.max.reportValidity();return;}document.getElementById('result').hidden=false;});document.querySelectorAll('[name="min"],[name="max"]').forEach(input=>input.addEventListener('input',()=>document.querySelector('[name="max"]').setCustomValidity('')));</script></body></html>
