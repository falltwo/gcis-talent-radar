<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>招募瀏覽器起始頁</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#244b78;font:18px/1.7 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:880px;margin:150px auto;padding:40px;background:#fff;border:1px solid #bbcde3;border-radius:12px}h1{font-size:30px;margin:0 0 14px}label{display:block;margin-bottom:8px}input{width:100%;padding:16px;font:inherit;border:1px solid #96b2d3;border-radius:6px;color:#183d6a}button{margin-top:20px;padding:14px 24px;font:inherit;color:#fff;background:#2c588c;border:0;border-radius:6px;cursor:pointer}input:focus,button:focus{outline:3px solid #d9a34f;outline-offset:3px}p{font-size:15px;color:#45688f}#error{color:#9c352d}</style></head><body><main><h1>開啟招募網站</h1><p>Computer Use 將在這裡輸入網站網址，再進入企業求才表單。</p><form id="navigation"><label for="site-url">招募網站網址</label><input id="site-url" type="url" required autocomplete="off" placeholder="請輸入本機招募網站網址"><button type="submit">開啟招募網站</button><p id="error" role="alert"></p></form></main><script>
document.getElementById('navigation').addEventListener('submit',event=>{event.preventDefault();const target=document.getElementById('site-url').value.trim();if(target!==location.origin+'/mock104'){document.getElementById('error').textContent='請輸入本次指定的本機招募網站網址。';return;}location.assign(target);});
</script></body></html>
